<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Digger Buddy">
  <!-- two-tone background: pastel sky band (~2/3) over ground band (~1/3) -->
  <rect width="800" height="600" fill="#BBDEFB"/>
  <rect y="400" width="800" height="200" fill="#FFE0B2"/>
  <rect y="400" width="800" height="26" fill="#FFCC80"/>
  <g fill="#FFFFFF" opacity="0.95">
    <ellipse cx="150" cy="94" rx="68" ry="30"/>
    <ellipse cx="212" cy="82" rx="46" ry="22"/>
    <ellipse cx="640" cy="132" rx="56" ry="24"/>
  </g>
  <!-- arm + bucket -->
  <g stroke="#F57C00" stroke-width="34" stroke-linecap="round" fill="none">
    <path d="M 505 300 L 630 180"/>
    <path d="M 630 180 L 690 292"/>
  </g>
  <path d="M 656 292 L 742 292 L 724 380 L 676 380 Z" fill="#546E7A"/>
  <!-- tracks -->
  <rect x="150" y="430" width="430" height="72" rx="36" fill="#37474F"/>
  <rect x="184" y="448" width="362" height="36" rx="18" fill="#546E7A"/>
  <g fill="#B0BEC5">
    <circle cx="222" cy="466" r="14"/>
    <circle cx="300" cy="466" r="14"/>
    <circle cx="378" cy="466" r="14"/>
    <circle cx="456" cy="466" r="14"/>
    <circle cx="530" cy="466" r="14"/>
  </g>
  <!-- cab body -->
  <rect x="180" y="280" width="310" height="152" rx="34" fill="#FFD54F"/>
  <rect x="208" y="306" width="122" height="94" rx="18" fill="#B3E5FC"/>
  <rect x="180" y="396" width="310" height="26" fill="#EF5350"/>
  <!-- cute face on the body -->
  <circle cx="396" cy="338" r="15" fill="#37474F"/>
  <circle cx="462" cy="338" r="15" fill="#37474F"/>
  <path d="M 382 378 Q 429 412 476 378" fill="none" stroke="#37474F" stroke-width="12" stroke-linecap="round"/>
</svg>
