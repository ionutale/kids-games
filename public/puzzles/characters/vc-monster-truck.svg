<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Monster Truck">
  <!-- two-tone background: pastel sky band (~2/3) over ground band (~1/3) -->
  <rect width="800" height="600" fill="#BBDEFB"/>
  <rect y="400" width="800" height="200" fill="#C5E1A5"/>
  <rect y="400" width="800" height="26" fill="#AED581"/>
  <g fill="#FFFFFF" opacity="0.95">
    <ellipse cx="150" cy="92" rx="68" ry="30"/>
    <ellipse cx="650" cy="128" rx="58" ry="26"/>
    <ellipse cx="706" cy="120" rx="40" ry="20"/>
  </g>
  <!-- oversized wheels -->
  <g fill="#37474F">
    <circle cx="250" cy="430" r="96"/>
    <circle cx="560" cy="430" r="96"/>
  </g>
  <g fill="#B0BEC5">
    <circle cx="250" cy="430" r="38"/>
    <circle cx="560" cy="430" r="38"/>
  </g>
  <!-- chassis + body -->
  <rect x="200" y="300" width="410" height="86" rx="24" fill="#546E7A"/>
  <rect x="170" y="196" width="450" height="132" rx="36" fill="#66BB6A"/>
  <rect x="200" y="222" width="120" height="82" rx="18" fill="#B3E5FC"/>
  <rect x="170" y="300" width="450" height="26" fill="#FFD54F"/>
  <!-- cute face on the body -->
  <circle cx="468" cy="250" r="15" fill="#37474F"/>
  <circle cx="540" cy="250" r="15" fill="#37474F"/>
  <path d="M 452 290 Q 504 328 556 290" fill="none" stroke="#37474F" stroke-width="12" stroke-linecap="round"/>
</svg>
