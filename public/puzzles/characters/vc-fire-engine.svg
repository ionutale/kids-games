<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Fire Engine">
  <!-- two-tone background: pastel sky band (~2/3) over ground band (~1/3) -->
  <rect width="800" height="600" fill="#BBDEFB"/>
  <rect y="400" width="800" height="200" fill="#A5D6A7"/>
  <rect y="400" width="800" height="26" fill="#81C784"/>
  <g fill="#FFFFFF" opacity="0.95">
    <ellipse cx="160" cy="96" rx="70" ry="32"/>
    <ellipse cx="660" cy="140" rx="60" ry="26"/>
    <ellipse cx="716" cy="130" rx="40" ry="20"/>
  </g>
  <!-- ladder -->
  <g fill="#FFD54F">
    <rect x="286" y="196" width="300" height="15" rx="7"/>
    <rect x="286" y="228" width="300" height="15" rx="7"/>
    <rect x="320" y="196" width="14" height="47" rx="6"/>
    <rect x="392" y="196" width="14" height="47" rx="6"/>
    <rect x="464" y="196" width="14" height="47" rx="6"/>
    <rect x="536" y="196" width="14" height="47" rx="6"/>
  </g>
  <!-- wheels -->
  <g fill="#37474F">
    <circle cx="240" cy="440" r="52"/>
    <circle cx="580" cy="440" r="52"/>
  </g>
  <g fill="#B0BEC5">
    <circle cx="240" cy="440" r="20"/>
    <circle cx="580" cy="440" r="20"/>
  </g>
  <!-- body -->
  <rect x="100" y="250" width="600" height="180" rx="40" fill="#EF5350"/>
  <rect x="100" y="368" width="600" height="30" fill="#FFD54F"/>
  <rect x="132" y="280" width="112" height="88" rx="18" fill="#B3E5FC"/>
  <circle cx="662" cy="312" r="20" fill="#FFD54F"/>
  <!-- cute face on the body -->
  <circle cx="520" cy="300" r="15" fill="#37474F"/>
  <circle cx="596" cy="300" r="15" fill="#37474F"/>
  <path d="M 505 344 Q 558 384 611 344" fill="none" stroke="#37474F" stroke-width="12" stroke-linecap="round"/>
</svg>
