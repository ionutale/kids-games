<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Train Buddy">
  <!-- two-tone background: pastel sky band (~2/3) over ground band (~1/3) -->
  <rect width="800" height="600" fill="#BBDEFB"/>
  <rect y="400" width="800" height="200" fill="#A5D6A7"/>
  <rect y="400" width="800" height="26" fill="#81C784"/>
  <g fill="#FFFFFF" opacity="0.95">
    <ellipse cx="150" cy="95" rx="70" ry="32"/>
    <ellipse cx="212" cy="82" rx="48" ry="24"/>
    <ellipse cx="648" cy="140" rx="62" ry="28"/>
    <ellipse cx="702" cy="130" rx="42" ry="20"/>
  </g>
  <!-- wheels -->
  <g fill="#37474F">
    <circle cx="250" cy="440" r="48"/>
    <circle cx="430" cy="440" r="48"/>
    <circle cx="610" cy="440" r="48"/>
  </g>
  <g fill="#B0BEC5">
    <circle cx="250" cy="440" r="18"/>
    <circle cx="430" cy="440" r="18"/>
    <circle cx="610" cy="440" r="18"/>
  </g>
  <!-- chimney -->
  <rect x="185" y="165" width="64" height="95" rx="12" fill="#37474F"/>
  <rect x="170" y="152" width="94" height="28" rx="14" fill="#455A64"/>
  <!-- body -->
  <rect x="140" y="250" width="530" height="170" rx="48" fill="#EF5350"/>
  <rect x="140" y="380" width="530" height="30" fill="#FFD54F"/>
  <rect x="175" y="282" width="122" height="92" rx="20" fill="#B3E5FC"/>
  <circle cx="655" cy="312" r="22" fill="#FFD54F"/>
  <!-- cute face on the body -->
  <circle cx="470" cy="300" r="15" fill="#37474F"/>
  <circle cx="545" cy="300" r="15" fill="#37474F"/>
  <path d="M 455 345 Q 507 386 560 345" fill="none" stroke="#37474F" stroke-width="12" stroke-linecap="round"/>
</svg>
